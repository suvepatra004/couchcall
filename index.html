<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Couchcall – game nights and movie nights</title>
    <meta
      name="description"
      content="Instant video rooms for game nights and movie nights. No signup."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛋️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="home">
    <main class="card">
      <h1>🛋️ Couchcall</h1>
      <p class="sub">
        Instant rooms for game nights and movie nights. No signup.
      </p>
      <input
        id="name"
        placeholder="Your name"
        maxlength="40"
        autocomplete="nickname"
        aria-label="Your name"
      />
      <div class="modes">
        <label>
          <input type="radio" name="m" value="g" checked />
          <span>🎮<b>Game night</b><i>Lean video, voice first</i></span>
        </label>
        <label>
          <input type="radio" name="m" value="m" />
          <span>🍿<b>Movie night</b><i>Big screen, synced player</i></span>
        </label>
        <label>
          <input type="radio" name="m" value="c" />
          <span>💬<b>Just hang</b><i>Plain room</i></span>
        </label>
      </div>
      <button id="create" class="button button--primary" type="button">
        Create room
      </button>
      <div class="or">or join a friend's room</div>
      <form id="join">
        <input
          id="code"
          placeholder="Room code or link"
          aria-label="Room code or link"
        />
        <button class="button button--secondary" type="submit">Join</button>
      </form>
    </main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>

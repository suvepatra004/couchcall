<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Couchcall room</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛋️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="room">
    <form id="gate">
      <h2>Almost in 👋</h2>
      <input
        id="gname"
        placeholder="Your name"
        maxlength="40"
        required
        aria-label="Your name"
      /><button class="btn">Join room</button>
    </form>

    <div id="app" hidden>
      <header id="bar">
        <a class="logo" href="/" title="Home">🛋️ Couchcall</a>
        <button class="chip code" id="code" title="Copy room code">
          <span id="rn"></span> 📋
        </button>
        <button class="chip" id="copy" title="Copy invite link">
          🔗 Invite
        </button>
        <button class="chip" id="layout" title="Tile / focus view">
          ▦ Layout
        </button>
        <button class="chip" id="theater" title="Hide the toolbar">
          🎬 Theater
        </button>
        <button class="chip" id="lite" title="Lower video quality">
          🐢 Lite
        </button>
        <button class="chip" id="watch" title="Synced video player">
          🍿 Watch
        </button>
        <button class="chip" id="chatb" title="Chat">
          💬 Chat <b id="unread" hidden>0</b>
        </button>
        <button class="chip fxb" data-e="🎉">🎉</button
        ><button class="chip fxb" data-e="😂">😂</button
        ><button class="chip fxb" data-e="🔥">🔥</button>
        <button class="chip danger" id="leave">Leave</button>
      </header>
      <button class="chip" id="exit" hidden>Exit theater</button>

      <main id="stage">
        <section id="player">
          <div class="pbar">
            <input
              id="url"
              placeholder="Paste a YouTube link or a direct .mp4 / .webm link"
              aria-label="Video link"
            />
            <button class="btn" id="load">Load</button>
            <label
              class="btn ghost"
              for="file"
              title="Everyone opens the same file on their own device"
              >📁 File</label
            >
            <input id="file" type="file" accept="video/*" hidden />
          </div>
          <div id="screen">
            <p id="empty">
              Nothing playing yet. Paste a link above and press Load. Everyone
              in the room sees it.
            </p>
            <div id="ytwrap" hidden><div id="yt"></div></div>
            <video id="vid" controls playsinline hidden></video>
          </div>
          <small id="note"
            >Plays in sync for everyone. If it doesn't start on your side, press
            play once.</small
          >
        </section>

        <div id="jitsi">
          <div id="jhead">
            <span>👥 Faces <i>drag me · resize from the corner</i></span
            ><button class="chip" id="jmin" title="Minimize">–</button>
          </div>
          <div id="jframe"></div>
          <div id="grip" title="Resize"></div>
        </div>

        <aside id="chat" hidden>
          <header>
            <b>💬 Chat</b
            ><button class="chip" id="cx" aria-label="Close chat">✕</button>
          </header>
          <div id="msgs" role="log" aria-live="polite">
            <p class="hint">Say hi 👋 Messages vanish when everyone leaves.</p>
          </div>
          <div id="emo" hidden></div>
          <form id="cf">
            <button type="button" class="chip" id="eb" aria-label="Emoji">
              😊</button
            ><input
              id="ci"
              placeholder="Type a message…"
              maxlength="500"
              autocomplete="off"
            /><button class="btn">Send</button>
          </form>
        </aside>
      </main>
      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/js/room.js"></script>
  </body>
</html>

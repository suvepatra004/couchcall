<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Couchcall room</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛋️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="room">
    <form id="gate">
      <h2>Almost in 👋</h2>
      <input
        id="gname"
        placeholder="Your name"
        maxlength="40"
        required
        aria-label="Your name"
      /><button class="button button--primary" type="submit">Join room</button>
    </form>

    <div id="app" hidden>
      <header id="bar">
        <a class="logo" href="/" title="Home">🛋️ Couchcall</a>
        <button
          class="button button--quiet code"
          id="code"
          type="button"
          title="Copy room code"
        >
          <span id="rn"></span> 📋
        </button>
        <button
          class="button button--quiet"
          id="copy"
          type="button"
          title="Copy invite link"
        >
          🔗 Invite
        </button>
        <button
          class="button button--quiet"
          id="layout"
          type="button"
          title="Switch between grid and speaker view"
        >
          ▦ Layout
        </button>
        <button
          class="button button--quiet"
          id="theater"
          type="button"
          title="Hide the toolbar for a bigger screen"
        >
          🎬 Theater
        </button>
        <button
          class="button button--quiet"
          id="lite"
          type="button"
          title="Lower video quality to save internet data. Turn on if video lags."
        >
          📶 Low data
        </button>
        <button
          class="button button--quiet"
          id="watch"
          type="button"
          title="Show or hide the shared video player"
        >
          🍿 Watch
        </button>
        <button
          class="button button--quiet"
          id="chatb"
          type="button"
          title="Chat"
        >
          💬 Chat <b id="unread" hidden>0</b>
        </button>
        <button class="button button--quiet fxb" data-e="🎉" type="button">
          🎉</button
        ><button class="button button--quiet fxb" data-e="😂" type="button">
          😂</button
        ><button class="button button--quiet fxb" data-e="🔥" type="button">
          🔥
        </button>
        <button class="button button--danger" id="leave" type="button">
          Leave
        </button>
      </header>

      <main id="stage">
        <div id="work">
          <section id="player" aria-label="Shared video player">
            <div class="pbar">
              <input
                id="url"
                placeholder="Paste a YouTube link or a direct video link (.mp4, .webm)"
                aria-label="Video link"
                autocomplete="off"
              />
              <button
                class="button button--secondary"
                id="pastebtn"
                type="button"
                title="Paste from clipboard"
              >
                📋 Paste
              </button>
              <button class="button button--primary" id="load" type="button">
                Load
              </button>
              <button
                class="button button--danger"
                id="exit"
                type="button"
                hidden
                title="Show the toolbar again (Esc)"
              >
                ✕ Exit theater
              </button>
              <label
                class="button button--secondary"
                for="file"
                title="Everyone opens the same file on their own device"
                >📁 Local file</label
              >
              <input id="file" type="file" accept="video/*" hidden />
            </div>
            <div id="screen">
              <p id="empty">
                Load a YouTube link or direct video URL to watch together.
              </p>
              <div id="ytwrap" hidden><div id="yt"></div></div>
              <video id="vid" controls playsinline hidden></video>
            </div>
            <small id="note"
              >Local files play from each person's device. Use only content you
              have permission to watch.</small
            >
          </section>

          <section id="jitsi" aria-label="Video call">
            <div id="jhead">
              <span>Video call <i>Drag to move</i></span
              ><span class="floating-actions">
                <button
                  class="button button--quiet button--small"
                  id="jlayout"
                  type="button"
                >
                  Layout
                </button>
                <button
                  class="button button--danger button--small"
                  id="jleave"
                  type="button"
                >
                  Leave
                </button>
                <button
                  class="button button--quiet button--small"
                  id="jmin"
                  type="button"
                  title="Minimize"
                >
                  –
                </button>
              </span>
            </div>
            <div id="jframe"></div>
            <button
              class="button button--avatar"
              id="bubble"
              type="button"
              aria-label="Restore video call"
              title="Click to restore · drag to move"
            >
              <span id="ini">?</span><b id="cnt"></b>
            </button>
            <div id="grip" title="Resize" aria-hidden="true"></div>
          </section>
        </div>

        <aside id="chat" aria-label="Room chat" hidden>
          <header>
            <b>💬 Chat</b
            ><span
              ><button
                class="button button--quiet button--small"
                id="snd"
                type="button"
                title="Message sound on/off"
              >
                🔔</button
              ><button
                class="button button--quiet button--small"
                id="cx"
                type="button"
                aria-label="Close chat"
              >
                ✕
              </button></span
            >
          </header>
          <div id="msgs" role="log" aria-live="polite">
            <p class="hint">Say hi 👋 Messages vanish when everyone leaves.</p>
          </div>
          <div id="emo" hidden></div>
          <form id="cf">
            <button
              type="button"
              class="button button--quiet"
              id="eb"
              aria-label="Emoji"
            >
              😊</button
            ><input
              id="ci"
              placeholder="Type a message…"
              maxlength="500"
              autocomplete="off"
            /><button class="button button--primary" type="submit">Send</button>
          </form>
        </aside>
      </main>
      <div id="toast" role="status" hidden></div>
    </div>
    <script type="module" src="/js/room.js"></script>
  </body>
</html>
